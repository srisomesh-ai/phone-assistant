name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PhoneAssistant.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneAssistant
          path: PhoneAssistant.apk

      - name: Publish as "latest" release (download on phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Phone Assistant (build ${{ github.run_number }})"
          body: "Install PhoneAssistant.apk on Bangru / Raja. Installs over the previous version."
          files: PhoneAssistant.apk
          make_latest: true
          prerelease: false
