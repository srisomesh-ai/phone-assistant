name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        id: build
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log

      - name: Report build failure to an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAIL=$(grep -iE "e: |error:|FAILED|What went wrong|Could not|Unresolved|Caused by" build.log | head -60)
          [ -z "$TAIL" ] && TAIL=$(tail -80 build.log)
          BODY=$(printf 'Build #%s failed.\n\n```\n%s\n```' "${{ github.run_number }}" "$TAIL")
          if gh issue list --state open --search "Build failures in:title" | grep -q "Build failures"; then
            NUM=$(gh issue list --state open --search "Build failures in:title" --json number -q '.[0].number')
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "Build failures" --body "$BODY"
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PhoneAssistant.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneAssistant
          path: PhoneAssistant.apk

      - name: Publish as "latest" release (download on phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Phone Assistant (build ${{ github.run_number }})"
          body: "Install PhoneAssistant.apk on Bangru / Raja. Installs over the previous version."
          files: PhoneAssistant.apk
          make_latest: true
          prerelease: false
